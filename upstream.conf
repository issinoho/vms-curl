# Upstream curl release this port is built from.
UPSTREAM_NAME=curl
UPSTREAM_VERSION=8.23.0
UPSTREAM_URL=https://curl.se/download/curl-8.23.0.tar.xz
UPSTREAM_SHA256=8dadd7d2536a314f982ad05a651b713f426bf7d02cc2c76cffb9796f2218e6c5
# Daniel Stenberg's release signing key (https://daniel.haxx.se/mykey.asc).
# Public key: keys/curl-signing-key.asc
UPSTREAM_GPG_KEY=27EDEAF22F3ABCEB50DB9A125CC908FDB71E12C2
# Our patch level on top of the upstream release (8.23.0-vms1)
VMS_PATCH_LEVEL=1
# zlib for compressed transfers, built by github.com/issinoho/vms-zlib on each
# node in the same work directory: <workdir>.ZLIB_TREE.INSTALL_<arch>] (INCLUDE, LIB).
ZLIB_VERSION=1.4
ZLIB_TREE=ZLIB-1_4
# zstd for Content-Encoding: zstd, built by github.com/issinoho/vms-zstd on each
# node in the same work directory: <workdir>.ZSTD_TREE.INSTALL_<arch>] (patch 0012).
ZSTD_VERSION=1.6.0
ZSTD_TREE=ZSTD-1_6_0
# TLS: VSI's SSL3 kit (OpenSSL 3.0); its shared images are a prerequisite.
SSL_KIT=SSL3
# Default CA certificates shipped in the kit: Mozilla's root store as extracted
# by curl.se (https://curl.se/docs/caextract.html).  Installed as
# VMSCURL$ROOT:[SSL]CACERT.PEM, curl's compiled-in default (patch 0010).
CA_BUNDLE_URL=https://curl.se/ca/cacert-2026-11-05.pem
CA_BUNDLE_SHA256=427c064216761a1e72a8b30f0d954d08cb6e4435a82091fb865afd20c8497285
# Kit naming: VSI's CURL kit owns SYS$COMMON:[CURL], CURL$ROOT and
# CURL$STARTUP.COM, so ours is the product VMSCURL with VMSCURL$ROOT, and the
# two can be installed side by side.
KIT_PRODUCT=VMSCURL
