# Upstream curl release this port is built from.
UPSTREAM_NAME=curl
UPSTREAM_VERSION=8.22.0
UPSTREAM_URL=https://curl.se/download/curl-8.22.0.tar.xz
UPSTREAM_SHA256=f7ef3ae8a22e521f289803fe93543eb64c329b58aa73a9e224dfd915a2a5f4f7
# Daniel Stenberg's release signing key (https://daniel.haxx.se/mykey.asc).
# Public key: keys/curl-signing-key.asc
UPSTREAM_GPG_KEY=27EDEAF22F3ABCEB50DB9A125CC908FDB71E12C2
# Our patch level on top of the upstream release (8.22.0-vms1)
VMS_PATCH_LEVEL=1
# zlib for compressed transfers, built by github.com/issinoho/vms-zlib on each
# node in the same work directory: <workdir>.ZLIB_TREE.INSTALL_<arch>] (INCLUDE, LIB).
ZLIB_VERSION=1.3.2
ZLIB_TREE=ZLIB-1_3_2
# TLS: VSI's SSL3 kit (OpenSSL 3.0); its shared images are a prerequisite.
SSL_KIT=SSL3
